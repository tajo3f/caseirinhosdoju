<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6a2b12">
<meta name="color-scheme" content="light">
<title>Sem conexão | Caseirinhos do Ju</title>
<style>
  :root{--brown:#2b1208;--cream:#fffaf0;--muted:#6f5b4e;--line:rgba(87,45,22,.14)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(135deg,#fff8ea,#f7e7c8 60%,#efcc95);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
  .box{max-width:520px;width:100%;text-align:center;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:28px;padding:clamp(28px,6vw,46px);box-shadow:0 30px 70px rgba(51,20,8,.16)}
  .logo{width:126px;height:126px;object-fit:contain;margin:0 auto 10px;display:block}
  h1{font-size:clamp(1.6rem,5.5vw,2.1rem);margin:6px 0 10px;letter-spacing:-.03em}
  p{color:var(--muted);line-height:1.65;margin:0 auto 22px;max-width:42ch}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--brown);color:#fff;text-decoration:none;font-weight:800}
  .hint{margin-top:18px;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="assets/images/logo.webp" alt="Caseirinhos do Ju">
  <h1>Você está sem conexão.</h1>
  <p>Seu carrinho continua salvo neste navegador. Quando a internet voltar, recarregue a página para finalizar o pedido pelo WhatsApp.</p>
  <a class="btn" href="./">Tentar novamente</a>
  <p class="hint">Pedidos pelo WhatsApp: (27) 99651-1588</p>
</main>
</body>
</html>
