[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
