<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6a2b12">
<meta name="color-scheme" content="light">
<title>Página não encontrada | Caseirinhos do Ju</title>
<style>
  :root{--brown:#2b1208;--brown-2:#6a2b12;--caramel:#c97518;--cream:#fffaf0;--muted:#6f5b4e;--line:rgba(87,45,22,.14)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,rgba(255,205,130,.4),transparent 32%),linear-gradient(135deg,#fff8ea,#f7e7c8 60%,#efcc95);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
  .box{width:min(560px,100%);text-align:center;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:28px;padding:clamp(28px,6vw,48px);box-shadow:0 30px 70px rgba(51,20,8,.16)}
  .box img{width:118px;height:118px;object-fit:contain;margin:0 auto 8px;display:block}
  .tag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--caramel);margin-bottom:10px}
  h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;letter-spacing:-.03em;margin:0 0 10px}
  p{color:var(--muted);line-height:1.65;margin:0 auto 22px;max-width:44ch}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;font-weight:800;text-decoration:none;font-size:.9rem}
  .btn--primary{background:var(--brown);color:#fff;box-shadow:0 12px 26px rgba(60,24,11,.2)}
  .btn--wa{background:#197a49;color:#fff}
  .btn--ghost{border:1px solid var(--line);background:#fff;color:var(--brown-2)}
  footer{margin-top:26px;font-size:.72rem;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <img src="https://caseirinhosdoju.com.br/assets/images/logo.webp" alt="Caseirinhos do Ju">
  <span class="tag">Caseirinhos do Ju</span>
  <h1>Essa página não existe.</h1>
  <p>O endereço pode ter mudado ou o link está incompleto. Volte ao cardápio e continue seu pedido — ou fale direto com o atendimento.</p>
  <div class="actions">
    <a class="btn btn--primary" href="https://caseirinhosdoju.com.br/#cardapio">Ir para o cardápio</a>
    <a class="btn btn--wa" href="https://wa.me/5527996511588?text=Ol%C3%A1!%20Preciso%20de%20ajuda%20com%20o%20site%20do%20Caseirinhos%20do%20Ju." rel="noopener noreferrer" target="_blank">Falar no WhatsApp</a>
  </div>
  <footer>© <span id="y">2026</span> Caseirinhos do Ju · Todos os direitos reservados.</footer>
</main>
</body>
</html>
